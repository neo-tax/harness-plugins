name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Includes the contract test, the parser fixtures, the end-to-end tests
      # against the fake ingest server, the spec traceability checks, and the
      # check that PRIVACY.md matches the statement generated from the
      # allowlist.
      - run: go test -race ./...
      - name: Cross-compile release targets
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/neo-tax-agent ./cmd/fake-ingest
          done

  # @spec: test-and-release#plugin-validate-in-ci
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - name: Validate every plugin directory
        run: for d in plugins/*/; do claude plugin validate "$d"; done

  # @spec: test-and-release#install-smoke-test
  # Not required until it has been stable for a release cycle; it needs the
  # ANTHROPIC_API_KEY secret and is skipped where that is absent (forks).
  install-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Install smoke test
        if: env.ANTHROPIC_API_KEY != ''
        run: ./scripts/smoke-test.sh
