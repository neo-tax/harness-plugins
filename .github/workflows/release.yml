# The only workflow that publishes a release: it runs when a semantic-version
# tag is pushed.
#
# @spec: test-and-release#release-on-tag
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Read-only by default; only publish and open_pull_request write.
# @spec: test-and-release#workflow-token-least-privilege
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      major: ${{ steps.v.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tagged commit is the release branch's single version bump, so the
      # code it releases is code on main. A tag on any other commit would
      # publish unreviewed code under an official version.
      # @spec: test-and-release#release-from-main
      - name: Tagged commit is a version bump on top of main
        run: |
          git fetch -q origin main
          if [ "$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)" -ne 2 ]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not a single-parent commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA^" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, whose parent is not on main"
            exit 1
          fi
          other=$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" |
            grep -v -x -E 'plugins/[^/]+/\.claude-plugin/plugin\.json|\.claude-plugin/marketplace\.json|channels/latest/marketplace\.json' || true)
          if [ -n "$other" ]; then
            echo "::error::$GITHUB_REF_NAME changes more than the plugin manifests: $other"
            exit 1
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # @spec: test-and-release#manifest-version-matches-tag
      - run: go run ./cmd/release-check "$GITHUB_REF_NAME"
      - run: go test ./...
      - id: v
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

  # Opens the release pull request once the tagged commit has passed the
  # checks, so a tag the workflow refuses never gets one. Merging it is not
  # done here: scripts/finish-release.sh fast-forwards main to the commit.
  # @spec: test-and-release#release-pull-request-by-workflow
  open_pull_request:
    needs: check
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/$GITHUB_REF_NAME"
          # A rerun, or a run after the release was finished, has nothing to do.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state all --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "already opened: $existing"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Release $GITHUB_REF_NAME" \
            --body "Bumps every plugin to ${GITHUB_REF_NAME#v} and pins the stable marketplace to $GITHUB_REF_NAME, in the one commit $GITHUB_REF_NAME points at.

          This workflow builds and publishes $GITHUB_REF_NAME from that commit and installs it the way a fleet does. Once it and CI pass, an organization admin runs \`scripts/finish-release.sh $GITHUB_REF_NAME\`, which fast-forwards main to the commit and marks this pull request merged. Do not use the merge button: a squash would leave $GITHUB_REF_NAME off main.

          Finishing it is what points every engineer's install and auto-update at $GITHUB_REF_NAME."

  # @spec: test-and-release#release-targets
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin/arm64, darwin/amd64, linux/amd64, linux/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build agent and fake ingest
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          goos=${TARGET%/*}; goarch=${TARGET#*/}; ext=""
          [ "$goos" = windows ] && ext=.exe
          mkdir -p dist
          for cmd in neo-tax-agent fake-ingest; do
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION" \
              -o "dist/${cmd}_${goos}_${goarch}${ext}" "./cmd/$cmd"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ strategy.job-index }}
          path: dist/*

  # v0.x binaries ship unsigned. From v1.0 macOS binaries are signed and
  # notarized and Windows binaries are signed before they are attached.
  # @spec: test-and-release#unsigned-binaries-v0-1
  # @spec: test-and-release#signing-v1-0
  sign_macos:
    needs: [check, build]
    if: needs.check.outputs.major >= 1
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Sign and notarize
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          kc=build.keychain
          security create-keychain -p ci "$kc"
          security default-keychain -s "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          echo "$NOTARY_KEY" > notary.p8
          for f in dist/*_darwin_*; do
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$f"
            zip -j "$f.zip" "$f"
            xcrun notarytool submit "$f.zip" --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
            rm "$f.zip"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-darwin
          path: dist/*_darwin_*

  sign_windows:
    needs: [check, build]
    if: needs.check.outputs.major >= 1
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: dist/*_windows_*

  # @spec: test-and-release#release-attaches-binaries
  # @spec: test-and-release#fake-ingest-is-released
  publish:
    needs: [check, build, sign_macos, sign_windows]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Use signed binaries (v1.0 and later)
        if: needs.check.outputs.major >= 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun after a successful publish keeps the binaries already
          # attached rather than failing on the existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Installs the release the way a fleet does before anyone is pointed at it:
  # the marketplace's git-subdir source fetched from GitHub at the tag, and
  # the launcher downloading and verifying the binary attached to the release.
  # @spec: test-and-release#fleet-install-before-rollout
  fleet_install:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - name: Install from the release and run one session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMOKE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || export SMOKE_SKIP_PROMPT=1
          ./scripts/smoke-test.sh
